version: "3.8"

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-file-format=Barracuda        # Required for Frappe DDL stability
      - --innodb-large-prefix=1               # Prevents structural index key length limits
      - --transaction-isolation=READ-COMMITTED # Standard Frappe isolation requirement
    environment:
      # Secure implementation: Pass via Coolify's environment variable panel
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MARIADB:-123}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    # Build inline to guarantee file safety instead of pulling raw image
    build:
      context: .
      dockerfile: Dockerfile
    # Explicitly invoke bash and handle permission layer safely
    command: /bin/bash -c "chmod +x /workspace/init.sh && /bin/bash /workspace/init.sh"
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    ports:
      - 8002:8002
      - 9000:9000

volumes:
  mariadb-data:
